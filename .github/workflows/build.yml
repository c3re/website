name: Build

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: golang:1.26

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install minify
        run: go install github.com/tdewolff/minify/v2/cmd/minify@latest
      - name: Install hugo
        run: go install github.com/gohugoio/hugo@v0.156.0
      - name: Run make
        run: make

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Content regression tests compare the original texts with dd22591.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build tools
        run: |
          go install github.com/gohugoio/hugo@v0.156.0
          go install github.com/tdewolff/minify/v2/cmd/minify@latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Content, keyboard and axe checks
        run: npm run test:a11y
      - name: Lighthouse accessibility
        run: npm run audit:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: |
            test-results/
            a11y-reports/
          retention-days: 14
