<div class="preferences" hidden>
    <button id="simple-language" type="button" aria-pressed="false" aria-controls="main-content">
        <span>Einfache Sprache</span>
        <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
    </button>
    <div class="theme-switch" role="group" aria-label="Farben der Seite">
        <button type="button" data-set-theme="light" aria-pressed="false" aria-label="Helles Design" title="Helles Design"><span aria-hidden="true">☀</span></button>
        <button type="button" data-set-theme="dark" aria-pressed="true" aria-label="Dunkles Design" title="Dunkles Design"><span aria-hidden="true">☾</span></button>
    </div>
</div>
<span id="preferences-status" class="language-status" role="status" aria-live="polite"></span>
