<section class="side-calendar" aria-labelledby="calendar-heading">
    <div class="side-heading">
        <h2 id="calendar-heading">Termine</h2>
        <a href="https://klaut.c3re.de/apps/calendar/p/A7sGSxRJdzsHBJea">{{ partial "text.html" (dict "standard" "Zum Kalender" "simple" "Alle Termine ansehen") }} <span aria-hidden="true">&rarr;</span></a>
    </div>
    <p id="calendar-status" role="status" aria-live="polite">
        {{ partial "text.html" (dict "standard" "Termine werden geladen..." "simple" "Wir laden die Termine...") }}
    </p>
    <ul id="calendar" aria-busy="true"></ul>
    <p id="calendar-copy-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Bitte &ouml;ffne den Kalender &uuml;ber den Link oben. Ohne JavaScript werden hier keine Termine geladen.</p></noscript>
</section>
